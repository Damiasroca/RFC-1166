; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; First-time setup: copy src/secrets.example.h to src/secrets.h (gitignored) and fill in your values.

[platformio]
; Work around occasional Windows file locks on .pio/build (close Serial Monitor, then delete .pio/build).
build_dir = .pio/build2

[env:esp32cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800
board_build.partitions = partitions_ota.csv
board_build.sdkconfig_defaults = sdkconfig.defaults
build_flags =
    -DCONFIG_JD_USE_ROM=1
    -DCONFIG_HTTPD_WS_SUPPORT=1
extra_scripts =
    pre:scripts/gen_build_info.py
    pre:scripts/embed_web.py
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    https://github.com/0015/ESP32-OV5640-AF.git

; Seeed XIAO ESP32S3 Sense on COM4 (8 MB flash, 8 MB octal PSRAM, OV3660).
[env:xiao_esp32s3]
extends = env:esp32cam
board = seeed_xiao_esp32s3
